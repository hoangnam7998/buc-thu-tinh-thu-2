<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bức Thư Tình Gửi Quỳnh Anh</title>
    <!-- Nhúng font chữ viết tay nghệ thuật từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #010001;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            perspective: 1200px;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            /* Thêm hiệu ứng mờ nhẹ cho nền để các dải màu trông mịn màng hơn */
            filter: blur(2px);
        }

        #bubbleContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .floating-bubble {
            position: absolute;
            will-change: transform, opacity;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            opacity: 0;
            box-sizing: content-box; 
        }

        /* --- BONG BÓNG ẢNH SIÊU TRONG SUỐT --- */
        .photo-bubble {
            width: 120px;
            height: 120px;
        }

        .photo-bubble .bubble-shell {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.45) 0%, 
                rgba(255, 255, 255, 0.1) 40%, 
                rgba(255, 182, 193, 0.02) 70%, 
                rgba(138, 43, 226, 0.08) 100%
            );
            box-shadow: 
                inset 0 0 10px rgba(255, 255, 255, 0.3),
                0 0 8px rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(0.8px);
            backdrop-filter: blur(0.8px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            z-index: 2;
            pointer-events: none;
            animation: bubbleWobble 4s infinite ease-in-out alternate;
        }

        .photo-bubble .bubble-shell::after {
            content: '';
            position: absolute;
            top: 12%; left: 18%;
            width: 25%; height: 25%;
            background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            filter: blur(1px);
        }

        /* Bong bóng trái tim */
        .heart-bubble {
            font-size: 38px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
            color: #ff69b4;
        }
        .heart-bubble .bubble-content {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .heart-bubble .bubble-shell {
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.6) 0%, 
                rgba(255, 255, 255, 0.2) 40%, 
                rgba(255, 182, 193, 0.05) 100%
            );
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
            -webkit-backdrop-filter: blur(1px);
            backdrop-filter: blur(1px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 2;
            pointer-events: none;
        }

        @keyframes bubbleWobble {
            0% { transform: scale(0.98) translate(1px, -1px); }
            33% { transform: scale(1.02) translate(-1px, 1px); }
            66% { transform: scale(1.0) translate(1px, 1px); }
            100% { transform: scale(0.99) translate(-1px, -1px); }
        }

        .bubble-content {
            position: relative;
            z-index: 1;
            border-radius: 50%;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-bubble .bubble-content {
            width: 120px;
            height: 120px;
        }

        .photo-bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Nút nhạc */
        .music-control {
            position: fixed;
            top: 20px; right: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 8px 15px; border-radius: 20px;
            cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.3s ease;
        }
        .music-control:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }

        /* --- BANNER NGÀY THÁNG --- */
        @keyframes dateGlowPulse { 
            0%, 100% { text-shadow: 0 0 10px rgba(255, 105, 180, 0.6), 0 0 20px rgba(255, 105, 180, 0.4); } 
            50% { text-shadow: 0 0 20px rgba(255, 20, 147, 1), 0 0 35px rgba(255, 105, 180, 0.8); } 
        }
        .top-date-banner {
            position: fixed; top: 12%; left: 50%; transform: translateX(-50%); z-index: 15;
            color: #fff; font-size: 56px; font-family: 'Great Vibes', cursive;
            letter-spacing: 3px; text-align: center; pointer-events: none;
            animation: dateGlowPulse 3s infinite ease-in-out;
        }

        /* Phong bì */
        .envelope-container { position: relative; z-index: 10; cursor: pointer; text-align: center; transition: transform 0.3s ease; }
        .envelope-container:hover { transform: scale(1.05); }
        .envelope { width: 280px; height: 180px; background: #fff; border-radius: 10px; position: relative; box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2); display: flex; justify-content: center; align-items: center; }
        .envelope::before { content: ''; position: absolute; top: 0; left: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 100px solid #e0e0e0; transform-origin: top; transition: transform 0.6s ease; z-index: 3; }
        .envelope-text { position: relative; z-index: 4; font-size: 18px; color: #333; font-weight: 600; letter-spacing: 1px; margin-top: 40px; pointer-events: none; }
        .envelope-container.open .envelope::before { transform: rotateX(180deg); z-index: 0; }
        .envelope-container.open { opacity: 0; pointer-events: none; transform: scale(0.8); transition: all 0.5s ease; position: absolute; }

        /* Hộp thư */
        .letter-modal, .ending-text-box { position: fixed; top: 55%; left: 50%; transform-style: preserve-3d; transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1); will-change: transform, opacity; }
        .letter-modal { width: 90%; max-width: 550px; background: #fff; padding: 35px 30px; border-radius: 15px; box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3); z-index: 20; opacity: 0; pointer-events: none; text-align: center; transform: translate(-50%, -50%) scale(0.5) rotateY(-90deg); }
        .letter-modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1) rotateY(0deg); }
        .letter-modal.minimized { transform: translate(-140%, -50%) scale(0.42); opacity: 0.85; pointer-events: auto; cursor: pointer; box-shadow: 0 5px 25px rgba(255, 105, 180, 0.6); }
        .letter-title { font-size: 22px; color: #d63384; margin-bottom: 15px; font-family: serif; font-weight: bold; }
        .letter-content { font-size: 15px; color: #444; line-height: 1.7; text-align: left; max-height: 340px; overflow-y: auto; padding-right: 10px; white-space: pre-wrap; word-break: break-word; }
        .letter-content::-webkit-scrollbar { width: 6px; }
        .letter-content::-webkit-scrollbar-thumb { background-color: #f0a5c0; border-radius: 3px; }

        /* --- PHẦN KẾT (3 DÒNG CUỐI) --- */
        @keyframes textGlowPulse { 
            0%, 100% { text-shadow: 0 0 10px rgba(255, 105, 180, 0.5), 0 0 20px rgba(255, 105, 180, 0.3); } 
            50% { text-shadow: 0 0 20px rgba(255, 20, 147, 1), 0 0 35px rgba(255, 105, 180, 0.8); } 
        }
        .ending-text-box { 
            z-index: 25; width: 90%; max-width: 650px; color: #fff; 
            font-size: 38px; 
            font-family: 'Great Vibes', cursive;
            line-height: 1.6; text-align: center; opacity: 0; pointer-events: none; 
            transform: translate(-50%, -50%) scale(0.5) rotateY(90deg); 
            animation: textGlowPulse 3s infinite ease-in-out; 
        }
        .ending-text-box.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1) rotateY(0deg); }
        .ending-text-box.compact { transform: translate(-140%, -50%) scale(0.42); opacity: 0.85; pointer-events: auto; cursor: pointer; text-align: left; }
        .ending-text-box.compact:hover { opacity: 1; }

        .fade-line {
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }
        .fade-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .ending-text-box .highlight-line { 
            color: #ffb6c1; font-weight: bold; font-size: 44px; margin-top: 15px; 
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 30px rgba(255, 20, 147, 0.8);
        }

        @media (max-width: 768px) {
            .letter-modal.minimized, .ending-text-box.compact { transform: translate(-50%, -130%) scale(0.38); }
            .top-date-banner { top: 10%; font-size: 42px; }
            .ending-text-box { font-size: 30px; }
            .photo-bubble, .photo-bubble .bubble-shell, .photo-bubble .bubble-content { width: 100px; height: 100px; }
            .heart-bubble { font-size: 28px; }
            .heart-bubble .bubble-content { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="love2.mp3" type="audio/mp3">
        Trình duyệt của bạn không hỗ trợ thẻ âm thanh.
    </audio>

    <button class="music-control" id="musicBtn" onclick="toggleMusic()">
        🎵 <span id="musicStatus">Bật nhạc</span>
    </button>

    <div class="top-date-banner">14/8 ~ 14/10</div>

    <canvas id="bgCanvas"></canvas>
    <div id="bubbleContainer"></div>

    <div class="envelope-container" id="envelopeBtn" onclick="openLetter()">
        <div class="envelope">
            <div class="envelope-text">💌 Chạm để mở thư</div>
        </div>
    </div>

    <div class="letter-modal" id="letterModal" onclick="handleMinimizedLetterClick(event)">
        <div class="letter-title">Gửi Quỳnh Anh ❤️</div>
        <div class="letter-content" id="letterText"></div>
    </div>

    <div class="ending-text-box" id="endingTextBox" onclick="handleEndingClick(event)">
        <div class="fade-line" id="line1">Thui hết đoạn sến súa dãi bài rồi. Và sau tất cả anh vẫn muốn nói là.</div>
        <div class="fade-line" id="line2" style="margin-top: 15px;">Anh ❤️ Quỳnh Anh của anh nhiều lắm!</div>
        <div class="fade-line highlight-line" id="line3">Nam Yêu Quỳnh Anh.</div>
    </div>

    <script>
        // --- NỘI DUNG THƯ ---
        const fullText = `Chúng mình đã chính thức yêu nhau được 2 tháng này rồi bé.
Đây là bức thư tình thứ 2 trong chuyên mục mỗi tháng 1 bó hoa kỉ niệm của chúng ta và 1 bức thư tình gửi đến bé.
Tháng thứ 2 đầy ắp những niềm vui, nhưng cũng có một số khoảng lặng nhỉ. Cảm ơn vì sau tất cả vẫn cho anh tiếp tục được yêu thương em, cho anh được có cơ hội chứng minh lại những điều anh từng làm chưa tốt. Em có thể dành một chút thời gian nghe anh già này sến súa thật lòng một chút được không.

Anh biết sau hôm đó dù mình đã quay lại nhưng sự tự nhiên của 2 ta phần nào đã không còn được như ban đầu. Anh chỉ muốn nói là anh xin lỗi vì lúc đó đã chưa được tốt, kể cả ngay sau khi em nói ra điều làm em buồn thì anh cũng đã thực sự không bình tĩnh mà cứ cố gắng giải thích, ép em phải thay đổi suy nghĩ ngay lập tức từ những gì tự mình vừa chứng kiến mà hoàn toàn không để cho em một chút thời gian nào, rồi dần dần chính anh là người tự đẩy 2 ta ra xa khiến hôm đó em muốn dừng lại. Vào thời điểm em nói “anh biến mất khỏi đời tôi” đi thực sự anh rất buồn và rất lo lắng vì làm tổn thương em như thế. Khi đó thật sự nếu có điều kiện ở gần sân bay thì anh sẽ không cần suy nghĩ mà bay thẳng về để được gặp em.

Những chuyện đã xảy ra rồi mình cũng không thể xóa đi được, nhưng điều duy nhất anh muốn nói với em là kể từ thời điểm mình yêu nhau, em luôn là điều rất quan trọng với anh, chưa một giây nào anh để những thứ khác làm mình phải lăn tăn, đắn đo với em cả, anh luôn muốn có một tình yêu All in với em. Kể cả những điều anh từng nói đến chuyện lâu dài của 2 đứa cũng là điều thật lòng anh nói, vì anh thật sự nghiêm túc với mối quan hệ này, với em. Anh biết những gì em chứng kiến dù thực hay chỉ là hiểu lầm thì em cũng cần thời gian thích nghi. Buồn thật nhỉ, nhưng lần này anh sẽ không mất bình tĩnh nữa, vì anh tin đến một thời điểm nào đó mình sẽ lại được tự nhiên như xưa và còn tốt hơn thế nữa.`;

        // --- XỬ LÝ NHẠC NỀN ---
        const bgMusic = document.getElementById('bgMusic');
        const musicStatus = document.getElementById('musicStatus');
        let isMusicPlaying = false;
        function toggleMusic() {
            if (isMusicPlaying) { bgMusic.pause(); musicStatus.innerText = "Bật nhạc"; isMusicPlaying = false; }
            else { bgMusic.play().then(() => { musicStatus.innerText = "Tắt nhạc"; isMusicPlaying = true; }).catch(e => console.log("Trình duyệt chặn:", e)); }
        }

        // --- HIỆU ỨNG NỀN (SILK/AURORA) ĐÃ SỬA ĐỔI ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const silkStreams = [];
        // Tăng số lượng dải màu lên 8 (thay vì 5) để tăng mật độ
        for (let i = 0; i < 8; i++) { 
            silkStreams.push({ 
                startY: (canvas.height / 8) * i + (Math.random() * 100 - 50), 
                amplitude: Math.random() * 150 + 100, // Tăng độ uốn lượn (to hơn)
                frequency: Math.random() * 0.0008 + 0.0004, // Tần số sóng
                speed: Math.random() * 0.2 + 0.08, 
                offset: Math.random() * 2000, 
                thickness: Math.random() * 80 + 50, // Tăng độ dày nét vẽ (dải màu to)
                maxAlpha: Math.random() * 0.06 + 0.03, // Độ mờ
                hue: Math.random() * 40 + 310 // Dải màu hồng tím (310-350)
            }); 
        }

        function animateSilk() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter'; // Tạo hiệu ứng sáng chồng lên nhau
            
            silkStreams.forEach(stream => {
                stream.offset += stream.speed; 
                ctx.save(); 
                ctx.beginPath();

                let gradient = ctx.createLinearGradient(0, stream.startY, 0, stream.startY + stream.thickness);
                // Màu từ điểm cong hất lên/xuống sẽ nhạt dần (alpha -> 0)
                gradient.addColorStop(0, `hsla(${stream.hue}, 90%, 70%, 0)`);
                gradient.addColorStop(0.5, `hsla(${stream.hue}, 90%, 70%, ${stream.maxAlpha})`);
                gradient.addColorStop(1, `hsla(${stream.hue}, 90%, 70%, 0)`);

                for (let x = -100; x <= canvas.width + 100; x += 30) {
                    let y = stream.startY + Math.sin((x + stream.offset) * stream.frequency) * stream.amplitude;
                    x === -100 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.strokeStyle = gradient; 
                ctx.lineWidth = stream.thickness; 
                ctx.lineCap = 'round'; 
                ctx.stroke(); 
                ctx.restore();
            });
            requestAnimationFrame(animateSilk);
        }
        animateSilk();

        // --- HỆ THỐNG BONG BÓNG ---
        const bubbleContainer = document.getElementById('bubbleContainer');
        const heartSymbols = ["❤", "💖", "💗", "💓", "💞", "💕", "💘", "💌", "✨"];
        const maxPhotos = 40;
        const activeBubbles = [];
        let bubbleCreationInterval;

        class Bubble {
            constructor() {
                this.element = document.createElement('div');
                this.element.classList.add('floating-bubble');
                
                const shell = document.createElement('div');
                shell.classList.add('bubble-shell');
                
                const content = document.createElement('div');
                content.classList.add('bubble-content');

                if (Math.random() < 0.16) {
                    this.element.classList.add('heart-bubble');
                    content.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                } else {
                    this.element.classList.add('photo-bubble');
                    let imgIndex = Math.floor(Math.random() * maxPhotos) + 1;
                    const img = document.createElement('img');
                    img.src = `anh (${imgIndex}).jpg`;
                    img.loading = "lazy";
                    content.appendChild(img);
                }

                this.element.appendChild(content);
                this.element.appendChild(shell);
                bubbleContainer.appendChild(this.element);

                this.x = -150 - Math.random() * window.innerWidth * 0.3;
                this.y = window.innerHeight + 150 + Math.random() * 150;
                
                this.vx = Math.random() * 2.5 + 2.0; 
                this.vy = -(Math.random() * 1.5 + 1.8);  

                this.amplitude = Math.random() * 70 + 30; 
                this.frequency = Math.random() * 0.005 + 0.002; 
                this.phase = Math.random() * Math.PI * 2; 

                this.opacity = 1;
                this.element.style.opacity = 1;
            }

            update(deltaTime) {
                this.x += this.vx;
                this.y += this.vy;

                let waveOffset = Math.sin(this.x * this.frequency + this.phase) * this.amplitude;
                this.element.style.transform = `translate(${this.x}px, ${this.y + waveOffset}px) translateZ(0)`;

                return (this.x < window.innerWidth + 200 && this.y + waveOffset > -200);
            }

            remove() {
                this.element.remove();
            }
        }

        let lastTime = 0;
        function gameLoop(currentTime) {
            if (!lastTime) lastTime = currentTime;
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            for (let i = activeBubbles.length - 1; i >= 0; i--) {
                if (!activeBubbles[i].update(deltaTime)) {
                    activeBubbles[i].remove();
                    activeBubbles.splice(i, 1);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function createSingleBubble() {
            activeBubbles.push(new Bubble());
            activeBubbles.push(new Bubble());
        }

        function startContinuousBubbles() {
            if (bubbleCreationInterval) clearInterval(bubbleCreationInterval);
            createSingleBubble(); 
            bubbleCreationInterval = setInterval(createSingleBubble, 450);
            requestAnimationFrame(gameLoop); 
        }

        // --- ĐIỀU KHIỂN LUỒNG CHÍNH (MỞ THƯ & KẾT THÚC) ---
        let isFirstOpen = true;
        function startTypingEffect() {
            const textContainer = document.getElementById('letterText'); textContainer.innerHTML = "";
            let index = 0;
            function type() {
                if (index < fullText.length) { textContainer.innerHTML += fullText.charAt(index); index++; textContainer.scrollTop = textContainer.scrollHeight; setTimeout(type, 28); }
                else { setTimeout(showEndingLines, 800); }
            }
            type();
        }

        function showEndingLines() {
            const modal = document.getElementById('letterModal'); 
            const endingBox = document.getElementById('endingTextBox');
            
            modal.classList.add('minimized'); 
            endingBox.classList.add('show');

            setTimeout(() => { document.getElementById('line1').classList.add('visible'); }, 300);
            setTimeout(() => { document.getElementById('line2').classList.add('visible'); }, 2200);
            setTimeout(() => { document.getElementById('line3').classList.add('visible'); }, 4100);
        }

        function handleEndingClick(event) {
            const endingBox = document.getElementById('endingTextBox'); if (!endingBox.classList.contains('compact')) return;
            const modal = document.getElementById('letterModal'); endingBox.classList.remove('compact'); endingBox.classList.add('show'); modal.classList.remove('show'); modal.classList.add('minimized');
        }

        function handleMinimizedLetterClick(event) {
            const modal = document.getElementById('letterModal'); if (!modal.classList.contains('minimized')) return;
            const endingBox = document.getElementById('endingTextBox'); modal.classList.remove('minimized'); modal.classList.add('show'); endingBox.classList.remove('show'); endingBox.classList.add('compact');
        }

        function openLetter() {
            const container = document.getElementById('envelopeBtn'); const modal = document.getElementById('letterModal');
            container.classList.add('open');
            setTimeout(() => {
                modal.classList.add('show');
                if (isFirstOpen) {
                    startContinuousBubbles(); 
                    startTypingEffect(); isFirstOpen = false;
                }
            }, 300);
            if (!isMusicPlaying) toggleMusic();
        }
    </script>
</body>
</html>
