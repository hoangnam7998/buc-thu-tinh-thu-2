<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bức Thư Tình Gửi Quỳnh Anh</title>
    <!-- Nhúng font chữ viết tay nghệ thuật từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            perspective: 1200px;
        }

        /* --- NỀN HẢI LƯU MỊN MÀNG (NỀN ĐEN TUYỀN) --- */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            filter: blur(40px);
            opacity: 0.5;
        }

        #bubbleContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .floating-bubble {
            position: absolute;
            will-change: transform, opacity;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            opacity: 0;
            box-sizing: content-box; 
        }

        /* --- BONG BÓNG ẢNH SIÊU TRONG SUỐT --- */
        .photo-bubble {
            width: 120px;
            height: 120px;
        }

        .photo-bubble .bubble-shell {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.45) 0%, 
                rgba(255, 255, 255, 0.1) 40%, 
                rgba(255, 182, 193, 0.02) 70%, 
                rgba(138, 43, 226, 0.08) 100%
            );
            box-shadow: 
                inset 0 0 10px rgba(255, 255, 255, 0.3),
                0 0 8px rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(0.8px);
            backdrop-filter: blur(0.8px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            z-index: 2;
            pointer-events: none;
            animation: bubbleWobble 4s infinite ease-in-out alternate;
        }

        .photo-bubble .bubble-shell::after {
            content: '';
            position: absolute;
            top: 12%; left: 18%;
            width: 25%; height: 25%;
            background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            filter: blur(1px);
        }

        /* --- TRÁI TIM BAY --- */
        .heart-bubble {
            font-size: 38px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
            color: #ff69b4;
        }
        .heart-bubble .bubble-content {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes bubbleWobble {
            0% { transform: scale(0.98) translate(1px, -1px); }
            33% { transform: scale(1.02) translate(-1px, 1px); }
            66% { transform: scale(1.0) translate(1px, 1px); }
            100% { transform: scale(0.99) translate(-1px, -1px); }
        }

        .bubble-content {
            position: relative;
            z-index: 1;
            border-radius: 50%;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-bubble .bubble-content {
            width: 120px;
            height: 120px;
        }

        .photo-bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Nút nhạc */
        .music-control {
            position: fixed;
            top: 20px; right: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 8px 15px; border-radius: 20px;
            cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.3s ease;
        }
        .music-control:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }

        /* --- BANNER NGÀY THÁNG & BÓNG SÁNG TRÁI TIM RỘNG LỚN BAO TRÙM --- */
        @keyframes dateGlowPulse { 
            0%, 100% { text-shadow: 0 0 10px rgba(255, 105, 180, 0.6), 0 0 20px rgba(255, 105, 180, 0.4); } 
            50% { text-shadow: 0 0 25px rgba(255, 20, 147, 1), 0 0 45px rgba(255, 105, 180, 0.9); } 
        }

        /* Hiệu ứng bóng sáng hình trái tim nhấp nháy nhẹ */
        @keyframes heartGlowPulse {
            0%, 100% {
                opacity: 0.35;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 0.75;
                transform: translate(-50%, -50%) scale(1.06);
            }
        }

        .top-date-banner {
            position: fixed; top: 12%; left: 50%; transform: translateX(-50%); z-index: 15;
            color: #fff; font-size: 56px; font-family: 'Great Vibes', cursive;
            letter-spacing: 3px; text-align: center; pointer-events: none;
            animation: dateGlowPulse 3s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 120px; /* Tăng khoảng cách để đẩy 2 ảnh ra xa hơn, nằm gọn trong trái tim lớn */
            width: 100%;
            max-width: 1200px;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Bóng sáng hình trái tim cực lớn, đảm bảo ôm trọn hai ảnh và ngày tháng */
        .top-date-banner::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1100px;
            height: 380px;
            background: radial-gradient(ellipse at center, rgba(255, 105, 180, 0.45) 0%, rgba(255, 20, 147, 0.18) 45%, rgba(0, 0, 0, 0) 75%);
            /* Mở rộng bề ngang clip-path tối đa */
            clip-path: path('M550,350 C550,350 900,210 900,110 C900,50 830,15 755,15 C680,15 610,50 550,130 C490,50 420,15 345,15 C270,15 200,50 200,110 C200,210 550,350 550,350 Z');
            filter: blur(35px); /* Làm mờ nhòe viền mượt mà hòa vào không gian tối */
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            transition: opacity 1s ease;
        }

        /* Khi kích hoạt phóng to và nhấp nháy bóng sáng */
        .top-date-banner.emphasize {
            transform: translateX(-50%) scale(1.1);
        }

        .top-date-banner.emphasize::before {
            opacity: 1;
            animation: heartGlowPulse 2.5s infinite ease-in-out;
        }

        /* --- HIỆU ỨNG TRÁI TIM CHUYỂN THÀNH ẢNH ĐÔI --- */
        .side-avatar-wrapper {
            width: 90px;
            height: 90px;
            position: relative;
            display: inline-block;
            vertical-align: middle;
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .side-avatar-wrapper.show {
            opacity: 1;
            transform: scale(1);
        }

        .side-heart, .side-photo {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Bước 1: Hiển thị trái tim */
        .side-heart {
            background: radial-gradient(circle, rgba(255, 105, 180, 0.4) 0%, rgba(0, 0, 0, 0.8) 80%);
            border: 2px solid rgba(255, 182, 193, 0.8);
            font-size: 40px;
            color: #ff69b4;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.8);
            z-index: 2;
            transform: scale(1) rotate(0deg);
        }

        /* Bước 2: Biến đổi mở ra thành ảnh trong 1s */
        .side-avatar-wrapper.transformed .side-heart {
            transform: scale(0) rotate(180deg);
            opacity: 0;
            pointer-events: none;
        }

        .side-photo {
            opacity: 0;
            transform: scale(0) rotate(-180deg);
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,105,180,0.2));
            z-index: 1;
        }

        .side-avatar-wrapper.transformed .side-photo {
            opacity: 1;
            transform: scale(1) rotate(0deg);
            animation: sideAvatarFloat 4s infinite ease-in-out alternate;
        }

        .side-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes sideAvatarFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.02); }
        }

        .date-text-content {
            display: inline-block;
        }

        /* Phong bì */
        .envelope-container { position: relative; z-index: 10; cursor: pointer; text-align: center; transition: transform 0.3s ease; }
        .envelope-container:hover { transform: scale(1.05); }
        .envelope { width: 280px; height: 180px; background: #fff; border-radius: 10px; position: relative; box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2); display: flex; justify-content: center; align-items: center; }
        .envelope::before { content: ''; position: absolute; top: 0; left: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 100px solid #e0e0e0; transform-origin: top; transition: transform 0.6s ease; z-index: 3; }
        .envelope-text { position: relative; z-index: 4; font-size: 18px; color: #333; font-weight: 600; letter-spacing: 1px; margin-top: 40px; pointer-events: none; }
        .envelope-container.open .envelope::before { transform: rotateX(180deg); z-index: 0; }
        .envelope-container.open { opacity: 0; pointer-events: none; transform: scale(0.8); transition: all 0.5s ease; position: absolute; }

        /* Hộp thư */
        .letter-modal, .ending-text-box { position: fixed; top: 55%; left: 50%; transform-style: preserve-3d; transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1); will-change: transform, opacity; }
        .letter-modal { width: 90%; max-width: 550px; background: #fff; padding: 35px 30px; border-radius: 15px; box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3); z-index: 20; opacity: 0; pointer-events: none; text-align: center; transform: translate(-50%, -50%) scale(0.5) rotateY(-90deg); }
        .letter-modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1) rotateY(0deg); }
        .letter-modal.minimized { transform: translate(-140%, -50%) scale(0.42); opacity: 0.85; pointer-events: auto; cursor: pointer; box-shadow: 0 5px 25px rgba(255, 105, 180, 0.6); }
        .letter-title { font-size: 22px; color: #d63384; margin-bottom: 15px; font-family: serif; font-weight: bold; }
        .letter-content { font-size: 15px; color: #444; line-height: 1.7; text-align: left; max-height: 340px; overflow-y: auto; padding-right: 10px; white-space: pre-wrap; word-break: break-word; }
        .letter-content::-webkit-scrollbar { width: 6px; }
        .letter-content::-webkit-scrollbar-thumb { background-color: #f0a5c0; border-radius: 3px; }

        /* --- PHẦN KẾT (3 DÒNG CUỐI) CÓ KHUNG RIÊNG --- */
        .ending-text-box { 
            z-index: 25; width: 90%; max-width: 620px; 
            background: rgba(10, 10, 10, 0.85); 
            border: 1px solid rgba(255, 182, 193, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 105, 180, 0.1);
            color: #fff; 
            font-size: 36px; 
            font-family: 'Great Vibes', cursive;
            line-height: 1.5; text-align: center; opacity: 0; pointer-events: none; 
            transform: translate(-50%, -50%) scale(0.5) rotateY(90deg); 
        }
        .ending-text-box.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1) rotateY(0deg); }
        .ending-text-box.compact { transform: translate(-140%, -50%) scale(0.42); opacity: 0.85; pointer-events: auto; cursor: pointer; text-align: left; padding: 20px; }
        .ending-text-box.compact:hover { opacity: 1; }

        .fade-line {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }
        .fade-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .ending-text-box .highlight-line { 
            color: #ffb6c1; font-weight: bold; font-size: 42px; margin-top: 12px; 
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 30px rgba(255, 20, 147, 0.8);
        }

        @media (max-width: 768px) {
            .letter-modal.minimized, .ending-text-box.compact { transform: translate(-50%, -130%) scale(0.38); }
            .top-date-banner { top: 10%; font-size: 36px; gap: 40px; }
            .side-avatar-wrapper { width: 65px; height: 65px; }
            .ending-text-box { font-size: 28px; padding: 25px 20px; }
            .photo-bubble, .photo-bubble .bubble-shell, .photo-bubble .bubble-content { width: 100px; height: 100px; }
            .heart-bubble { font-size: 28px; }
            .heart-bubble .bubble-content { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="love2.mp3" type="audio/mp3">
        Trình duyệt của bạn không hỗ trợ thẻ âm thanh.
    </audio>

    <button class="music-control" id="musicBtn" onclick="toggleMusic()">
        🎵 <span id="musicStatus">Bật nhạc</span>
    </button>

    <div class="top-date-banner" id="dateBanner">
        <div class="side-avatar-wrapper" id="sideAvatarLeft">
            <div class="side-heart">❤️</div>
            <div class="side-photo"><img src="nam.jpg" alt="Nam"></div>
        </div>
        <div class="date-text-content">14/8 ~ 14/10</div>
        <div class="side-avatar-wrapper" id="sideAvatarRight">
            <div class="side-heart">💖</div>
            <div class="side-photo"><img src="wynh.jpg" alt="Quỳnh Anh"></div>
        </div>
    </div>

    <canvas id="bgCanvas"></canvas>
    <div id="bubbleContainer"></div>

    <div class="envelope-container" id="envelopeBtn" onclick="openLetter()">
        <div class="envelope">
            <div class="envelope-text">💌 Chạm để mở thư</div>
        </div>
    </div>

    <div class="letter-modal" id="letterModal" onclick="handleMinimizedLetterClick(event)">
        <div class="letter-title">Gửi Quỳnh Anh ❤️</div>
        <div class="letter-content" id="letterText"></div>
    </div>

    <div class="ending-text-box" id="endingTextBox" onclick="handleEndingClick(event)">
        <div class="fade-line" id="line1">Và sau tất cả anh vẫn muốn nói là.</div>
        <div class="fade-line" id="line2" style="margin-top: 12px;">Anh ❤️ Quỳnh Anh của anh nhiều lắm!</div>
        <div class="fade-line highlight-line" id="line3">Nam ❤️ Quỳnh Anh.</div>
    </div>

    <script>
        // --- NỘI DUNG THƯ ĐÃ CẬP NHẬT ---
        const fullText = `Happy Ani 2 month của chúng ta.

Đây là bức thư tình thứ 2 trong chuyên mục mỗi tháng 1 bó hoa kỉ niệm của chúng ta và 1 bức thư tình gửi đến bé.

Tháng thứ 2 đầy ắp những cảm xúc, và cảm ơn vì sau tất cả vẫn cho anh tiếp tục được yêu thương em, cho anh được có cơ hội chứng minh lại những điều anh từng làm chưa tốt. 

Cảm ơn bé vì đã xuất hiện, mang đến cho anh nhiều khoảnh khắc đẹp. 

Hi vọng trên hành trình phía trước cả hai ta luôn có nhau và cùng nhau trải qua những khoảnh khắc hạnh phúc hơn nữa.`;

        // --- XỬ LÝ NHẠC NỀN ---
        const bgMusic = document.getElementById('bgMusic');
        const musicStatus = document.getElementById('musicStatus');
        let isMusicPlaying = false;
        function toggleMusic() {
            if (isMusicPlaying) { bgMusic.pause(); musicStatus.innerText = "Bật nhạc"; isMusicPlaying = false; }
            else { bgMusic.play().then(() => { musicStatus.innerText = "Tắt nhạc"; isMusicPlaying = true; }).catch(e => console.log("Trình duyệt chặn:", e)); }
        }

        // --- HIỆU ỨNG HẢI LƯU TRÔI MỊN MÀNG TRÊN NỀN ĐEN ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const smokeParticles = [];
        const numParticles = 10;

        for (let i = 0; i < numParticles; i++) {
            smokeParticles.push({
                x: Math.random() * canvas.width,
                y: canvas.height + Math.random() * 200,
                vx: (Math.random() - 0.5) * 0.2,
                vy: -(Math.random() * 0.4 + 0.15),
                radius: Math.random() * 300 + 200,
                angle: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.002,
                alpha: Math.random() * 0.03 + 0.015,
                hue: Math.random() * 20 + 325
            });
        }

        function animateSmoke() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'screen';

            smokeParticles.forEach(p => {
                p.x += p.vx + Math.sin(p.angle) * 0.2;
                p.y += p.vy;
                p.angle += p.spin;

                if (p.y < -p.radius) {
                    p.y = canvas.height + p.radius;
                    p.x = Math.random() * canvas.width;
                }

                ctx.save();
                ctx.beginPath();
                let gradient = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.radius);
                gradient.addColorStop(0, `hsla(${p.hue}, 60%, 25%, ${p.alpha})`);
                gradient.addColorStop(0.5, `hsla(${p.hue}, 50%, 15%, ${p.alpha * 0.5})`);
                gradient.addColorStop(1, 'transparent');

                ctx.fillStyle = gradient;
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            requestAnimationFrame(animateSmoke);
        }
        animateSmoke();

        // --- HỆ THỐNG BONG BÓNG & TRÁI TIM ---
        const bubbleContainer = document.getElementById('bubbleContainer');
        const heartSymbols = ["❤", "💖", "💗", "💓", "💞", "💕", "💘", "💌", "✨"];
        const maxPhotos = 28;
        const activeBubbles = [];
        let bubbleCreationInterval;

        class Bubble {
            constructor() {
                this.element = document.createElement('div');
                this.element.classList.add('floating-bubble');
                
                const content = document.createElement('div');
                content.classList.add('bubble-content');

                if (Math.random() < 0.16) {
                    this.element.classList.add('heart-bubble');
                    content.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    this.element.appendChild(content);
                } else {
                    this.element.classList.add('photo-bubble');
                    
                    const shell = document.createElement('div');
                    shell.classList.add('bubble-shell');
                    
                    let imgIndex = Math.floor(Math.random() * maxPhotos) + 1;
                    const img = document.createElement('img');
                    img.src = `anh (${imgIndex}).jpg`;
                    img.loading = "lazy";
                    content.appendChild(img);

                    this.element.appendChild(content);
                    this.element.appendChild(shell);
                }

                bubbleContainer.appendChild(this.element);

                this.x = -150 - Math.random() * window.innerWidth * 0.3;
                this.y = window.innerHeight + 150 + Math.random() * 150;
                
                this.vx = Math.random() * 2.5 + 2.0; 
                this.vy = -(Math.random() * 1.5 + 1.8);  

                this.amplitude = Math.random() * 70 + 30; 
                this.frequency = Math.random() * 0.005 + 0.002; 
                this.phase = Math.random() * Math.PI * 2; 

                this.opacity = 1;
                this.element.style.opacity = 1;
            }

            update(deltaTime) {
                this.x += this.vx;
                this.y += this.vy;

                let waveOffset = Math.sin(this.x * this.frequency + this.phase) * this.amplitude;
                this.element.style.transform = `translate(${this.x}px, ${this.y + waveOffset}px) translateZ(0)`;

                return (this.x < window.innerWidth + 200 && this.y + waveOffset > -200);
            }

            remove() {
                this.element.remove();
            }
        }

        let lastTime = 0;
        function gameLoop(currentTime) {
            if (!lastTime) lastTime = currentTime;
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            for (let i = activeBubbles.length - 1; i >= 0; i--) {
                if (!activeBubbles[i].update(deltaTime)) {
                    activeBubbles[i].remove();
                    activeBubbles.splice(i, 1);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function createSingleBubble() {
            activeBubbles.push(new Bubble());
            activeBubbles.push(new Bubble());
        }

        function startContinuousBubbles() {
            if (bubbleCreationInterval) clearInterval(bubbleCreationInterval);
            createSingleBubble(); 
            bubbleCreationInterval = setInterval(createSingleBubble, 450);
            requestAnimationFrame(gameLoop); 
        }

        // --- ĐIỀU KHIỂN LUỒNG CHÍNH ---
        let isFirstOpen = true;
        function startTypingEffect() {
            const textContainer = document.getElementById('letterText'); textContainer.innerHTML = "";
            let index = 0;
            function type() {
                if (index < fullText.length) { textContainer.innerHTML += fullText.charAt(index); index++; textContainer.scrollTop = textContainer.scrollHeight; setTimeout(type, 32); }
                else { setTimeout(showEndingLines, 800); }
            }
            type();
        }

        function showEndingLines() {
            const modal = document.getElementById('letterModal'); 
            const endingBox = document.getElementById('endingTextBox');
            const dateBanner = document.getElementById('dateBanner');
            
            modal.classList.add('minimized'); 
            endingBox.classList.add('show');

            // Bước 1: Hiển thị 2 trái tim ở 2 bên ngay lập tức
            const leftAvatar = document.getElementById('sideAvatarLeft');
            const rightAvatar = document.getElementById('sideAvatarRight');
            leftAvatar.classList.add('show');
            rightAvatar.classList.add('show');

            // Bước 2: Sau 1.5 giây, trái tim nở ra thành ảnh trong 1 giây tiếp theo
            setTimeout(() => {
                leftAvatar.classList.add('transformed');
                rightAvatar.classList.add('transformed');
            }, 1500);

            // Bước 3: Đúng lúc ảnh nở xong (sau 2.5s), toàn bộ phần ảnh và ngày tháng phóng to kèm bóng sáng trái tim bao trùm nhấp nháy phía sau
            setTimeout(() => {
                dateBanner.classList.add('emphasize');
            }, 2500);

            // Bước 4: Lần lượt hiện các dòng chữ kết thúc
            setTimeout(() => { document.getElementById('line1').classList.add('visible'); }, 2300);
            setTimeout(() => { document.getElementById('line2').classList.add('visible'); }, 4000);
            setTimeout(() => { document.getElementById('line3').classList.add('visible'); }, 5700);
        }

        function handleEndingClick(event) {
            const endingBox = document.getElementById('endingTextBox'); if (!endingBox.classList.contains('compact')) return;
            const modal = document.getElementById('letterModal'); endingBox.classList.remove('compact'); endingBox.classList.add('show'); modal.classList.remove('show'); modal.classList.add('minimized');
        }

        function handleMinimizedLetterClick(event) {
            const modal = document.getElementById('letterModal'); if (!modal.classList.contains('minimized')) return;
            const endingBox = document.getElementById('endingTextBox'); modal.classList.remove('minimized'); modal.classList.add('show'); endingBox.classList.remove('show'); endingBox.classList.add('compact');
        }

        function openLetter() {
            const container = document.getElementById('envelopeBtn'); const modal = document.getElementById('letterModal');
            container.classList.add('open');
            setTimeout(() => {
                modal.classList.add('show');
                if (isFirstOpen) {
                    startContinuousBubbles(); 
                    startTypingEffect(); isFirstOpen = false;
                }
            }, 300);
            if (!isMusicPlaying) toggleMusic();
        }
    </script>
</body>
</html>
