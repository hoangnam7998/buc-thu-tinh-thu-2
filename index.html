<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bức Thư Tình Gửi Quỳnh Anh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #010001;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            perspective: 1200px;
        }

        /* Canvas chỉ dùng cho dải lụa nền để nhẹ CPU nhất */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Lớp chứa các bong bóng ảnh/trái tim tối ưu hóa bằng CSS GPU (Không giật lag) */
        #bubbleContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .floating-bubble {
            position: absolute;
            will-change: transform;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Bong bóng ảnh */
        .photo-bubble {
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5), 0 4px 15px rgba(255, 105, 180, 0.3);
            background: #ffb6c1;
        }

        .photo-bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bong bóng trái tim / ký tự */
        .heart-bubble {
            font-size: 28px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
        }

        @keyframes floatUpRight {
            0% {
                transform: translate3d(-150px, var(--startY), 0);
            }
            100% {
                transform: translate3d(calc(100vw + 150px), var(--endY), 0);
            }
        }

        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        @keyframes dateGlowPulse {
            0% {
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.5), 0 0 20px rgba(255, 20, 147, 0.3), 0 0 35px rgba(255, 192, 203, 0.2);
            }
            50% {
                text-shadow: 0 0 25px rgba(255, 105, 180, 1), 0 0 50px rgba(255, 20, 147, 0.7), 0 0 75px rgba(255, 182, 193, 0.5);
            }
            100% {
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.5), 0 0 20px rgba(255, 20, 147, 0.3), 0 0 35px rgba(255, 192, 203, 0.2);
            }
        }

        .top-date-banner {
            position: fixed;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            color: #fff;
            font-size: 44px;
            font-weight: 600;
            font-family: 'Georgia', serif;
            letter-spacing: 4px;
            text-align: center;
            pointer-events: none;
            animation: dateGlowPulse 3s infinite ease-in-out;
        }

        .envelope-container {
            position: relative;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .envelope-container:hover {
            transform: scale(1.05);
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #fff;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #e0e0e0;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 3;
        }

        .envelope-text {
            position: relative;
            z-index: 4;
            font-size: 18px;
            color: #333;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 40px;
            pointer-events: none;
        }

        .envelope-container.open .envelope::before {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .envelope-container.open {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: all 0.5s ease;
            position: absolute;
        }

        .letter-modal, .ending-text-box {
            position: fixed;
            top: 55%;
            left: 50%;
            transform-style: preserve-3d;
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            will-change: transform, opacity;
        }

        .letter-modal {
            width: 90%;
            max-width: 550px;
            background: #fff;
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            text-align: center;
            transform: translate(-50%, -50%) scale(0.5) rotateY(-90deg);
        }

        .letter-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1) rotateY(0deg);
        }

        .letter-modal.minimized {
            transform: translate(-140%, -50%) scale(0.42);
            opacity: 0.85;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(255, 105, 180, 0.6);
        }
        .letter-modal.minimized:hover {
            opacity: 1;
            box-shadow: 0 0 30px rgba(255, 105, 180, 1);
        }

        .letter-title {
            font-size: 22px;
            color: #d63384;
            margin-bottom: 15px;
            font-family: serif;
            font-weight: bold;
        }

        .letter-content {
            font-size: 15px;
            color: #444;
            line-height: 1.7;
            text-align: left;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .letter-content::-webkit-scrollbar {
            width: 6px;
        }
        .letter-content::-webkit-scrollbar-thumb {
            background-color: #f0a5c0;
            border-radius: 3px;
        }

        @keyframes textGlowPulse {
            0% {
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.4), 0 0 20px rgba(255, 20, 147, 0.2), 0 0 30px rgba(255, 192, 203, 0.1);
            }
            50% {
                text-shadow: 0 0 22px rgba(255, 105, 180, 0.9), 0 0 45px rgba(255, 20, 147, 0.6), 0 0 65px rgba(255, 182, 193, 0.4);
            }
            100% {
                text-shadow: 0 0 10px rgba(255, 105, 180, 0.4), 0 0 20px rgba(255, 20, 147, 0.2), 0 0 30px rgba(255, 192, 203, 0.1);
            }
        }

        .ending-text-box {
            z-index: 25;
            width: 90%;
            max-width: 560px;
            color: #fff;
            font-size: 25px;
            line-height: 1.7;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.5) rotateY(90deg);
            animation: textGlowPulse 3s infinite ease-in-out;
        }

        .ending-text-box.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1) rotateY(0deg);
        }

        .ending-text-box.compact {
            transform: translate(-140%, -50%) scale(0.42);
            opacity: 0.85;
            pointer-events: auto;
            cursor: pointer;
            text-align: left;
        }
        .ending-text-box.compact:hover {
            opacity: 1;
        }

        .ending-text-box .highlight-line {
            color: #ffb6c1;
            font-weight: bold;
            font-size: 28px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .letter-modal.minimized, .ending-text-box.compact {
                transform: translate(-50%, -130%) scale(0.38);
            }
            .top-date-banner {
                top: 10%;
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="love2.mp3" type="audio/mp3">
        Trình duyệt của bạn không hỗ trợ thẻ âm thanh.
    </audio>

    <button class="music-control" id="musicBtn" onclick="toggleMusic()">
        🎵 <span id="musicStatus">Bật nhạc</span>
    </button>

    <div class="top-date-banner">14/8 ~ 14/10</div>

    <canvas id="bgCanvas"></canvas>
    <div id="bubbleContainer"></div>

    <div class="envelope-container" id="envelopeBtn" onclick="openLetter()">
        <div class="envelope">
            <div class="envelope-text">💌 Chạm để mở thư</div>
        </div>
    </div>

    <div class="letter-modal" id="letterModal" onclick="handleMinimizedLetterClick(event)">
        <div class="letter-title">Gửi Quỳnh Anh ❤️</div>
        <div class="letter-content" id="letterText"></div>
    </div>

    <div class="ending-text-box" id="endingTextBox" onclick="handleEndingClick(event)">
        <span id="endingTextSpan"></span>
    </div>

    <script>
        const fullText = `Chúng mình đã chính thức yêu nhau được 2 tháng này rồi bé.
Đây là bức thư tình thứ 2 trong chuyên mục mỗi tháng 1 bó hoa kỉ niệm của chúng ta và 1 bức thư tình gửi đến bé.
Tháng thứ 2 đầy ắp những niềm vui, nhưng cũng có một số khoảng lặng nhỉ. Cảm ơn vì sau tất cả vẫn cho anh tiếp tục được yêu thương em, cho anh được có cơ hội chứng minh lại những điều anh từng làm chưa tốt. Em có thể dành một chút thời gian nghe anh già này sến súa thật lòng một chút được không.

Anh biết sau hôm đó dù mình đã quay lại nhưng sự tự nhiên của 2 ta phần nào đã không còn được như ban đầu. Anh chỉ muốn nói là anh xin lỗi vì lúc đó đã chưa được tốt, kể cả ngay sau khi em nói ra điều làm em buồn thì anh cũng đã thực sự không bình tĩnh mà cứ cố gắng giải thích, ép em phải thay đổi suy nghĩ ngay lập tức từ những gì tự mình vừa chứng kiến mà hoàn toàn không để cho em một chút thời gian nào, rồi dần dần chính anh là người tự đẩy 2 ta ra xa khiến hôm đó em muốn dừng lại. Vào thời điểm em nói “anh biến mất khỏi đời tôi” đi thực sự anh rất buồn và rất lo lắng vì làm tổn thương em như thế. Khi đó thật sự nếu có điều kiện ở gần sân bay thì anh sẽ không cần suy nghĩ mà bay thẳng về để được gặp em.

Những chuyện đã xảy ra rồi mình cũng không thể xóa đi được, nhưng điều duy nhất anh muốn nói với em là kể từ thời điểm mình yêu nhau, em luôn là điều rất quan trọng với anh, chưa một giây nào anh để những thứ khác làm mình phải lăn tăn, đắn đo với em cả, anh luôn muốn có một tình yêu All in với em. Kể cả những điều anh từng nói đến chuyện lâu dài của 2 đứa cũng là điều thật lòng anh nói, vì anh thật sự nghiêm túc với mối quan hệ này, với em. Anh biết những gì em chứng kiến dù thực hay chỉ là hiểu lầm thì em cũng cần thời gian thích nghi. Buồn thật nhỉ, nhưng lần này anh sẽ không mất bình tĩnh nữa, vì anh tin đến một thời điểm nào đó mình sẽ lại được tự nhiên như xưa và còn tốt hơn thế nữa.`;

        const endingRawHtml = `Thui hết đoạn sến súa dãi bài rồi. Và sau tất cả anh vẫn muốn nói là.<br><br>Anh ❤️ Quỳnh Anh của anh nhiều lắm!<br><br><div class="highlight-line">Nam Yêu Quỳnh Anh.</div>`;
        const endingPlainText = `Thui hết đoạn sến súa dãi bài rồi. Và sau tất cả anh vẫn muốn nói là.\n\nAnh ❤️ Quỳnh Anh của anh nhiều lắm!\n\nNam Yêu Quỳnh Anh.`;

        const bgMusic = document.getElementById('bgMusic');
        const musicStatus = document.getElementById('musicStatus');
        let isMusicPlaying = false;

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicStatus.innerText = "Bật nhạc";
                isMusicPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicStatus.innerText = "Tắt nhạc";
                    isMusicPlaying = true;
                }).catch(e => {
                    console.log("Trình duyệt chặn phát nhạc tự động:", e);
                });
            }
        }

        // 1. TỐI ƯU CANVAS: Chỉ dùng vẽ dải lụa nền cực nhẹ
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const silkStreams = [];
        const streamCount = 5; // Rất nhẹ cho CPU
        
        for (let i = 0; i < streamCount; i++) {
            silkStreams.push({
                startX: -100,
                startY: (canvas.height / streamCount) * i + (Math.random() * 80 - 40),
                amplitude: Math.random() * 60 + 20,
                frequency: Math.random() * 0.0005 + 0.0002,
                speed: Math.random() * 0.2 + 0.08,
                offset: Math.random() * 2000,
                thickness: Math.random() * 20 + 3,
                maxAlpha: Math.random() * 0.08 + 0.02,
                angleTilt: (Math.random() - 0.5) * 0.15
            });
        }

        function animateSilk() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            silkStreams.forEach(stream => {
                stream.offset += stream.speed;
                ctx.save();
                ctx.beginPath();

                let stepSize = 60; // Tối ưu bước nhảy để giảm tải tối đa
                let totalLength = canvas.width + 200;

                for (let x = -100; x <= totalLength; x += stepSize) {
                    let y = stream.startY + 
                            (x * stream.angleTilt) +
                            Math.sin((x + stream.offset) * stream.frequency) * stream.amplitude;
                    
                    if (x === -100) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                let grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
                grad.addColorStop(0, 'rgba(255, 105, 180, 0)');
                grad.addColorStop(0.5, `rgba(255, 192, 203, ${stream.maxAlpha})`);
                grad.addColorStop(1, 'rgba(255, 105, 180, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = stream.thickness;
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.restore();
            });

            requestAnimationFrame(animateSilk);
        }
        animateSilk();

        // 2. HỆ THỐNG BONG BÓNG BẰNG CSS ANIMATION (GPU ACCELERATED - HOÀN TOÀN KHÔNG GIẬT LAG)
        const bubbleContainer = document.getElementById('bubbleContainer');
        const heartSymbols = ["❤️", "💖", "💗", "💓", "💞", "💕", "💘", "💌", "✨"];
        const maxPhotos = 40;
        const totalBubbles = 18; // Số lượng vừa đủ đẹp và mượt mà tuyệt đối

        function createBubbles() {
            for (let i = 0; i < totalBubbles; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('floating-bubble');

                let isHeart = (i % 3 === 0);
                let size = isHeart ? (Math.random() * 15 + 22) : (Math.random() * 25 + 40); // Kích thước bán kính * 2

                if (isHeart) {
                    bubble.classList.add('heart-bubble');
                    bubble.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                } else {
                    bubble.classList.add('photo-bubble');
                    bubble.style.width = `${size}px`;
                    bubble.style.height = `${size}px`;

                    let imgIndex = Math.floor(Math.random() * maxPhotos) + 1;
                    const img = document.createElement('img');
                    img.src = `anh (${imgIndex}).jpg`;
                    img.loading = "lazy";
                    bubble.appendChild(img);
                }

                // Gán vị trí ngẫu nhiên và thời gian bay mượt mà
                let startYPos = Math.random() * window.innerHeight;
                let endYPos = startYPos + (Math.random() * 200 - 100);
                let duration = Math.random() * 10 + 12; // 12 đến 22 giây bay hết màn hình
                let delay = i * 1.2;

                bubble.style.setProperty('--startY', `${startYPos}px`);
                bubble.style.setProperty('--endY', `${endYPos}px`);
                bubble.style.animation = `floatUpRight ${duration}s linear ${delay}s infinite`;

                bubbleContainer.appendChild(bubble);
            }
        }

        // 3. HIỆU ỨNG GÕ CHỮ TỐI ƯU TỐC ĐỘ CAO
        let isFirstOpen = true;

        function startTypingEffect() {
            const textContainer = document.getElementById('letterText');
            textContainer.innerHTML = "";
            let index = 0;
            let chunkSize = 4; // Tăng lượng ký tự mỗi nhịp để siêu mượt và nhanh

            function type() {
                if (index < fullText.length) {
                    let chunk = fullText.substr(index, chunkSize);
                    textContainer.innerHTML += chunk;
                    index += chunkSize;
                    
                    textContainer.scrollTop = textContainer.scrollHeight;
                    setTimeout(type, 12);
                } else {
                    textContainer.scrollTop = textContainer.scrollHeight;
                    setTimeout(() => {
                        showEndingTextCenter();
                    }, 400);
                }
            }
            type();
        }

        function showEndingTextCenter() {
            const modal = document.getElementById('letterModal');
            const endingBox = document.getElementById('endingTextBox');
            const endingSpan = document.getElementById('endingTextSpan');

            modal.classList.add('minimized');
            endingBox.classList.add('show');
            endingBox.classList.remove('compact');
            endingSpan.innerHTML = "";

            let index = 0;
            function typeEnding() {
                if (index < endingPlainText.length) {
                    let char = endingPlainText.charAt(index);
                    if (char === '\n') {
                        endingSpan.innerHTML += "<br>";
                    } else {
                        endingSpan.innerHTML += char;
                    }
                    index++;
                    setTimeout(typeEnding, 15);
                } else {
                    endingSpan.innerHTML = endingRawHtml;
                }
            }
            typeEnding();
        }

        function handleEndingClick(event) {
            const endingBox = document.getElementById('endingTextBox');
            if (!endingBox.classList.contains('compact')) return; 

            const modal = document.getElementById('letterModal');
            endingBox.classList.remove('compact');
            endingBox.classList.add('show');
            modal.classList.remove('show');
            modal.classList.add('minimized');
        }

        function handleMinimizedLetterClick(event) {
            const modal = document.getElementById('letterModal');
            if (!modal.classList.contains('minimized')) return; 

            const endingBox = document.getElementById('endingTextBox');
            modal.classList.remove('minimized');
            modal.classList.add('show');
            endingBox.classList.remove('show');
            endingBox.classList.add('compact');
        }

        function openLetter() {
            const container = document.getElementById('envelopeBtn');
            const modal = document.getElementById('letterModal');

            container.classList.add('open');
            setTimeout(() => {
                modal.classList.add('show');
                
                if (isFirstOpen) {
                    createBubbles(); // Khởi tạo bong bóng bay mượt bằng GPU sau khi mở thư
                    startTypingEffect();
                    isFirstOpen = false;
                }
            }, 300);

            if (!isMusicPlaying) {
                toggleMusic();
            }
        }
    </script>
</body>
</html>
